name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build GUI (csc, .NET Framework 4.x)
        shell: pwsh
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /optimize+ /target:winexe /out:psvitapupextractor_gui.exe `
            /r:System.dll /r:System.Core.dll /r:System.Windows.Forms.dll /r:System.Drawing.dll `
            VitaKeys.cs VitaSce.cs VitaPup.cs VitaPupExtractorGui.cs
          if ($LASTEXITCODE -ne 0) { throw "csc failed" }

      - name: Package (gui + unarzl helper)
        shell: pwsh
        run: Compress-Archive -Path psvitapupextractor_gui.exe,unarzl.exe -DestinationPath psvitapupextractor_gui.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: psvitapupextractor_gui
          path: |
            psvitapupextractor_gui.exe
            unarzl.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            psvitapupextractor_gui.zip
            unarzl.exe
